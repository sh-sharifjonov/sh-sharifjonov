name: Metrics

on:
  # Автообновление раз в день (03:00 UTC)
  schedule: [{cron: "0 3 * * *"}]
  # Кнопка ручного запуска во вкладке Actions
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы action мог закоммитить SVG в репозиторий
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update github-metrics.svg [skip ci]"
          user: sh-sharifjonov
          filename: github-metrics.svg
          config_timezone: Asia/Dushanbe
          config_display: large

          # Шапка профиля, активность, репозитории
          base: header, activity, community, repositories, metadata

          # Самые используемые языки
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss

          # Изометрический календарь коммитов за полгода
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
